
services:
  - type: web
    name: juegos de mesa no tan de mesa
    runtime: node
    plan: free
    region: oregon

    buildCommand: >-
      unzip -o Juegos_de_mesa_no_tan_de_mesa.zip -d .
      && npm install --omit=dev --no-audit --no-fund

    startCommand: npm start

    healthCheckPath: /health
    autoDeploy: true
